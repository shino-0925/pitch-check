<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合唱パート音程チェック</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --sub: #6b6b70;
    --line: #e2e0db; --accent: #2f6fd6; --ok: #2e9e5b; --warn: #d9822b; --bad: #d64545;
    --ok-bg: #dff3e6; --high-bg: #fbe1dc; --low-bg: #dde8fb;
    --ok-fg: #1d7a43; --high-fg: #c2412d; --low-fg: #2c5fc0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131315; --card: #1e1e21; --text: #f2f2f4; --sub: #a0a0a8; --line: #333338; --accent: #5b92ee;
      --ok-bg: #173a26; --high-bg: #45201b; --low-bg: #1b2b4a;
      --ok-fg: #6fd69a; --high-fg: #ff8f7d; --low-fg: #8db4ff; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%; }
  body { padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  body.noscroll { overflow: hidden; }
  .wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .label { font-size: 13px; color: var(--sub); margin-bottom: 8px; }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; color: inherit; }

  /* 上部バー */
  .topbar { display: flex; align-items: center; gap: 10px; }
  .topbar .summary { flex: 1; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .gear { width: 52px; height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
    font-size: 26px; line-height: 1; display: flex; align-items: center; justify-content: center; }

  /* 今の音 */
  .now { text-align: center; padding: 16px; transition: background-color .15s; }
  .now.ok { background: var(--ok-bg); border-color: transparent; }
  .now.high { background: var(--high-bg); border-color: transparent; }
  .now.low { background: var(--low-bg); border-color: transparent; }
  .note { font-size: 80px; font-weight: 800; line-height: 1.05; min-height: 84px; }
  .row2 { display: flex; justify-content: center; align-items: baseline; gap: 14px; margin-top: 4px; min-height: 48px; }
  .cents { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .verdict { font-size: 26px; font-weight: 800; }
  .now.ok .verdict, .now.ok .cents { color: var(--ok-fg); }
  .now.high .verdict, .now.high .cents { color: var(--high-fg); }
  .now.low .verdict, .now.low .cents { color: var(--low-fg); }
  .hz { font-size: 17px; color: var(--sub); margin-top: 2px; font-variant-numeric: tabular-nums; min-height: 22px; }
  .dim { opacity: .35; }

  /* セントメーター */
  .cmeter { position: relative; height: 44px; margin: 4px 6px 0; }
  .cmeter .track { position: absolute; left: 0; right: 0; top: 18px; height: 8px; border-radius: 4px; background: var(--line); }
  .cmeter .band { position: absolute; top: 10px; height: 24px; border-radius: 6px; background: var(--ok); opacity: .28; }
  .cmeter .center { position: absolute; left: 50%; top: 8px; width: 2px; height: 28px; margin-left: -1px; background: var(--sub); }
  .cmeter .needle { position: absolute; top: 2px; width: 6px; height: 40px; margin-left: -3px; border-radius: 3px;
    background: var(--text); left: 50%; transition: left 60ms linear; }
  .cmeter .needle.hide { opacity: 0; }
  .cscale { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin: 2px 0 0; font-variant-numeric: tabular-nums; }

  /* 推移グラフ */
  canvas#graph { width: 100%; height: 180px; display: block; }
  .glegend { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin-top: 4px; }

  /* 操作 */
  .big { width: 100%; min-height: 64px; font-size: 20px; font-weight: 700; border: 0; border-radius: 16px;
    background: var(--accent); color: #fff; }
  .big.stop { background: var(--bad); }
  .big.sub { background: var(--card); color: var(--accent); border: 2px solid var(--accent); min-height: 56px; font-size: 18px; }
  .big:active, .step:active, .seg button:active { transform: scale(.98); }
  .vol { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; color: var(--sub); }
  .meter { position: relative; flex: 1; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: var(--ok); }
  .bar.quiet { background: var(--sub); }
  .thr { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); opacity: .6; }
  .status { font-size: 13px; color: var(--sub); white-space: nowrap; min-width: 6em; text-align: right; font-variant-numeric: tabular-nums; }
  .status.bad { color: var(--bad); }
  .err { font-size: 14px; line-height: 1.7; color: var(--bad); white-space: pre-wrap; display: none; }

  /* 設定パネル */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--bg); border-radius: 20px 20px 0 0; z-index: 11; transform: translateY(105%); transition: transform .22s ease;
    padding: 14px 16px calc(env(safe-area-inset-bottom) + 20px); }
  .sheet.open { transform: translateY(0); }
  .sheet-inner { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; }
  .sheet-head h2 { font-size: 18px; margin: 0; }
  .close { min-width: 88px; height: 48px; border-radius: 14px; border: 0; background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .step { width: 64px; height: 56px; font-size: 28px; font-weight: 700; border-radius: 14px;
    border: 2px solid var(--line); background: var(--card); }
  .step:disabled { opacity: .35; }
  .val { flex: 1; text-align: center; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .val small { font-size: 16px; color: var(--sub); font-weight: 500; }
  input[type=range] { width: 100%; margin-top: 12px; }
  .reset { margin-top: 6px; background: none; border: 0; color: var(--accent); font-size: 14px; padding: 6px 0; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
    font-size: 16px; font-weight: 600; }
  .seg button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .hint { font-size: 12px; color: var(--sub); margin-top: 6px; line-height: 1.6; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  th { color: var(--sub); font-weight: 500; font-size: 12px; }
  .pass { color: var(--ok); font-weight: 700; } .fail { color: var(--bad); font-weight: 700; }
  .testnote { font-size: 13px; color: var(--sub); margin-top: 8px; line-height: 1.6; }
  .info { font-size: 13px; color: var(--sub); line-height: 1.7; word-break: break-all; }
  .info b { color: var(--text); font-weight: 600; }
  details summary { cursor: pointer; font-size: 14px; color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <!-- 1. 上部バー -->
  <div class="topbar">
    <div class="summary" id="summary">平均律・A=442Hz・±10¢</div>
    <button class="gear" id="gear" type="button" aria-label="設定">⚙︎</button>
  </div>

  <!-- 2. 今の音 -->
  <div class="card now" id="now">
    <div class="note dim" id="note">―</div>
    <div class="row2"><span class="cents" id="cents"></span><span class="verdict" id="verdict"></span></div>
    <div class="hz" id="hz"></div>
  </div>

  <!-- 3. メーター -->
  <div class="card">
    <div class="cmeter">
      <div class="track"></div>
      <div class="band" id="band"></div>
      <div class="center"></div>
      <div class="needle hide" id="needle"></div>
    </div>
    <div class="cscale"><span>−50¢ 低い</span><span>0</span><span>高い +50¢</span></div>
  </div>

  <!-- 4. 推移グラフ -->
  <div class="card">
    <canvas id="graph" aria-label="音程の推移"></canvas>
    <div class="glegend"><span>直近8秒</span><span>縦軸：ずれ（¢）</span></div>
  </div>

  <!-- 5. 操作ボタン -->
  <div class="card">
    <button id="btn" class="big" type="button">マイク開始</button>
    <div class="vol">
      <span>音量</span>
      <div class="meter"><div id="bar" class="bar"></div><div id="thr" class="thr"></div></div>
      <span id="status" class="status">停止中</span>
    </div>
  </div>

  <div id="err" class="card err"></div>
</div>

<!-- 6. 設定パネル -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="設定">
  <div class="sheet-inner">
    <div class="sheet-head"><h2>設定</h2><button class="close" id="close" type="button">閉じる</button></div>

    <div class="card">
      <div class="label">判定幅（この範囲内なら「正しい」）</div>
      <div class="stepper">
        <button class="step" id="tMinus" type="button" aria-label="1セント狭く">−</button>
        <div class="val">±<span id="tVal">10</span> <small>¢</small></div>
        <button class="step" id="tPlus" type="button" aria-label="1セント広く">＋</button>
      </div>
      <input type="range" id="tRange" min="1" max="50" step="1" value="10" aria-label="判定幅">
      <button class="reset" id="tReset" type="button">±10¢に戻す</button>
    </div>

    <div class="card">
      <div class="label">音名の表記</div>
      <div class="seg" id="nameSeg">
        <button type="button" data-v="de">ドイツ音名</button>
        <button type="button" data-v="en">英音名</button>
        <button type="button" data-v="jp">ドレミ</button>
      </div>
      <div class="hint" id="nameHint"></div>
    </div>

    <div class="card">
      <div class="label">基準音（A4の周波数）</div>
      <div class="stepper">
        <button class="step" id="aMinus" type="button" aria-label="1Hz下げる">−</button>
        <div class="val"><span id="aVal">442</span> <small>Hz</small></div>
        <button class="step" id="aPlus" type="button" aria-label="1Hz上げる">＋</button>
      </div>
      <input type="range" id="aRange" min="430" max="450" step="1" value="442" aria-label="基準音">
      <button class="reset" id="aReset" type="button">442Hzに戻す</button>
    </div>

    <div class="card">
      <div class="label">音量しきい値（これより小さい音は表示しない）</div>
      <div class="val" style="text-align:left"><span id="lVal">−50</span> <small>dB</small></div>
      <input type="range" id="lRange" min="-70" max="-20" step="1" value="-50" aria-label="音量しきい値">
      <div class="hint">周りの雑音で表示がちらつくときは右へ、小さい声が表示されないときは左へ動かします。音量メーターの縦線がこの位置です。</div>
      <button class="reset" id="lReset" type="button">−50dBに戻す</button>
    </div>

    <div class="card">
      <div class="label">内部テスト（音は鳴りません）</div>
      <button id="testBtn" class="big sub" type="button">サイン波で解析テスト</button>
      <div id="testOut"></div>
    </div>

    <details class="card">
      <summary>動作環境の情報</summary>
      <div class="info" id="info" style="margin-top:8px"></div>
    </details>
  </div>
</div>

<script>
/* ===== 音高検出（YIN法） ===== */
const PITCH_MIN_HZ = 60, PITCH_MAX_HZ = 1300;
const YIN_THRESHOLD = 0.15;   // 周期とみなす谷の深さ
const YIN_ACCEPT = 0.35;      // これより浅い谷しかなければ「音程のない音」とする

// buf: Float32Array（2048サンプル）, sr: サンプリング周波数 → { freq, clarity } または null
function detectPitchYIN(buf, sr) {
  const N = buf.length;
  const tauMin = Math.max(2, Math.floor(sr / PITCH_MAX_HZ));
  const tauMax = Math.min(Math.ceil(sr / (PITCH_MIN_HZ * 0.95)), N - 512); // 下限より少し余裕を持たせる
  const W = N - tauMax - 1;
  if (W < 64) return null;
  const d = new Float32Array(tauMax + 2);
  for (let tau = 1; tau <= tauMax + 1; tau++) {
    let s = 0;
    for (let i = 0; i < W; i++) { const x = buf[i] - buf[i + tau]; s += x * x; }
    d[tau] = s;
  }
  const cm = new Float32Array(tauMax + 2);
  cm[0] = 1;
  let run = 0;
  for (let tau = 1; tau <= tauMax + 1; tau++) { run += d[tau]; cm[tau] = run > 0 ? d[tau] * tau / run : 1; }
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++) {
    if (cm[t] < YIN_THRESHOLD) { while (t + 1 <= tauMax && cm[t + 1] < cm[t]) t++; tau = t; break; }
  }
  if (tau < 0) {
    let best = Infinity;
    for (let t = tauMin; t <= tauMax; t++) if (cm[t] < best) { best = cm[t]; tau = t; }
    if (best > YIN_ACCEPT) return null;
  }
  if (tau <= tauMin || tau >= tauMax) return null;
  // 放物線補間（差分関数 d の谷で周期を細かく求める）
  const a = d[tau - 1], b = d[tau], c = d[tau + 1];
  const den = a - 2 * b + c;
  let shift = den > 0 ? 0.5 * (a - c) / den : 0;
  if (shift > 1 || shift < -1) shift = 0;
  const freq = sr / (tau + shift);
  if (freq < PITCH_MIN_HZ * 0.97 || freq > PITCH_MAX_HZ * 1.03) return null;
  return { freq, clarity: 1 - cm[tau] };
}

/* ===== 音名とセント（平均律） ===== */
function nearestET(freq, A) {
  const n = Math.round(69 + 12 * Math.log2(freq / A));
  const ref = A * Math.pow(2, (n - 69) / 12);
  return { midi: n, ref, cents: 1200 * Math.log2(freq / ref) };
}

// 英音名（C4＝中央ハ）
const NAMES_EN = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
// ドイツ音名（楽譜読み取り指示書10章）。調が分からないため、黒鍵は合唱でよく使う綴りにする
const NAMES_DE = ['c', 'cis', 'd', 'es', 'e', 'f', 'fis', 'g', 'as', 'a', 'b', 'h'];
const NAMES_JP = ['ド', 'ド♯', 'レ', 'ミ♭', 'ミ', 'ファ', 'ファ♯', 'ソ', 'ラ♭', 'ラ', 'シ♭', 'シ'];
const SUP = ['', '¹', '²', '³', '⁴', '⁵'];
const SUB = ['', '₁', '₂', '₃'];

function noteNameEN(midi) { return NAMES_EN[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1); }
// ヘルムホルツ式：C2〜H2＝大文字、C3〜H3＝小文字、C4〜＝¹、C5〜＝²、C1〜H1＝₁
function noteNameDE(midi) {
  const pc = ((midi % 12) + 12) % 12, oct = Math.floor(midi / 12) - 1;
  const base = NAMES_DE[pc];
  if (oct === 3) return base;
  if (oct > 3) return base + (SUP[oct - 3] || '^' + (oct - 3));
  const cap = base.charAt(0).toUpperCase() + base.slice(1);
  if (oct === 2) return cap;
  return cap + (SUB[2 - oct] || '_' + (2 - oct));
}
function noteNameJP(midi) { return NAMES_JP[((midi % 12) + 12) % 12]; }
function noteName(midi, style) {
  return style === 'en' ? noteNameEN(midi) : style === 'jp' ? noteNameJP(midi) : noteNameDE(midi);
}
function fmtCents(c) {
  const r = Math.round(c);
  if (r === 0) return '±0¢';
  return (r > 0 ? '+' : '−') + Math.abs(r) + '¢';
}
function judge(cents, tol) { return Math.abs(cents) <= tol ? 'ok' : cents > 0 ? 'high' : 'low'; }
function median(arr) {
  const s = arr.slice().sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/* ===== 画面 ===== */
(function () {
  if (typeof document === 'undefined') return;
  const $ = id => document.getElementById(id);

  const MIN_DB = -60;
  const HOLD_MS = 300;        // 音が途切れてから表示を消すまで
  const GRAPH_SEC = 8;        // 推移グラフの表示秒数
  const VERDICT_TEXT = { ok: '正しい', high: '高い', low: '低い' };

  /* --- 設定（端末に保存） --- */
  const DEF = { A: 442, tol: 10, names: 'de', level: -50 };
  const S = Object.assign({}, DEF);
  try {
    const saved = JSON.parse(localStorage.getItem('pc_settings') || '{}');
    const oldA = parseInt(localStorage.getItem('pc_A'), 10); // 段階1の保存値
    if (oldA >= 430 && oldA <= 450 && saved.A === undefined) saved.A = oldA;
    if (saved.A >= 430 && saved.A <= 450) S.A = saved.A;
    if (saved.tol >= 1 && saved.tol <= 50) S.tol = saved.tol;
    if (['de', 'en', 'jp'].includes(saved.names)) S.names = saved.names;
    if (saved.level >= -70 && saved.level <= -20) S.level = saved.level;
  } catch (_) {}
  function save() { try { localStorage.setItem('pc_settings', JSON.stringify(S)); } catch (_) {} }

  /* --- 今の音の表示 --- */
  const nowEl = $('now'), noteEl = $('note'), centsEl = $('cents'), verdictEl = $('verdict'), hzEl = $('hz'), needle = $('needle');
  let lastShown = 0;
  function clearNote() {
    lastShown = 0;
    nowEl.className = 'card now';
    noteEl.textContent = '―'; noteEl.classList.add('dim');
    centsEl.textContent = ''; verdictEl.textContent = ''; hzEl.textContent = '';
    needle.classList.add('hide');
  }
  function showNote(freq) {
    lastShown = freq;
    const r = nearestET(freq, S.A);
    const v = judge(r.cents, S.tol);
    nowEl.className = 'card now ' + v;
    noteEl.textContent = noteName(r.midi, S.names); noteEl.classList.remove('dim');
    centsEl.textContent = fmtCents(r.cents);
    verdictEl.textContent = VERDICT_TEXT[v];
    hzEl.textContent = freq.toFixed(1) + ' Hz' + (S.names === 'jp' ? '（' + noteNameEN(r.midi) + '）' : '');
    const c = Math.max(-50, Math.min(50, r.cents));
    needle.style.left = (50 + c) + '%';
    needle.classList.remove('hide');
  }

  /* --- 推移グラフ --- */
  const canvas = $('graph'), g = canvas.getContext('2d');
  let history = []; // {t: 秒, c: セント or null}
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function drawGraph() {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (!W) return;
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    const left = 34, right = W - 4, top = 6, bottom = H - 6;
    const y = c => top + (50 - Math.max(-50, Math.min(50, c))) / 100 * (bottom - top);
    // 判定幅の帯
    g.fillStyle = cssVar('--ok'); g.globalAlpha = 0.18;
    g.fillRect(left, y(S.tol), right - left, y(-S.tol) - y(S.tol));
    g.globalAlpha = 1;
    // 目盛り
    g.font = '11px -apple-system, sans-serif'; g.fillStyle = cssVar('--sub'); g.textAlign = 'right'; g.textBaseline = 'middle';
    g.strokeStyle = cssVar('--line'); g.lineWidth = 1;
    for (const c of [50, 25, 0, -25, -50]) {
      g.beginPath(); g.moveTo(left, y(c)); g.lineTo(right, y(c)); g.stroke();
      g.fillText((c > 0 ? '+' : c < 0 ? '−' : '') + Math.abs(c), left - 4, y(c));
    }
    if (!history.length) return;
    const tNow = history[history.length - 1].t;
    const x = t => right - (tNow - t) / GRAPH_SEC * (right - left);
    // 判定ごとに色分けした線
    g.lineWidth = 3; g.lineCap = 'round';
    const col = { ok: cssVar('--ok'), high: cssVar('--bad'), low: cssVar('--accent') };
    for (let i = 1; i < history.length; i++) {
      const p = history[i - 1], q = history[i];
      if (p.c === null || q.c === null || q.t - p.t > 0.25 || x(p.t) < left) continue;
      g.strokeStyle = col[judge(q.c, S.tol)];
      g.beginPath(); g.moveTo(x(p.t), y(p.c)); g.lineTo(x(q.t), y(q.c)); g.stroke();
    }
  }
  window.addEventListener('resize', drawGraph);

  /* --- 設定の反映 --- */
  function applySettings() {
    $('summary').textContent = '平均律・A=' + S.A + 'Hz・±' + S.tol + '¢';
    $('aVal').textContent = S.A; $('aRange').value = S.A;
    $('aMinus').disabled = S.A <= 430; $('aPlus').disabled = S.A >= 450;
    $('tVal').textContent = S.tol; $('tRange').value = S.tol;
    $('tMinus').disabled = S.tol <= 1; $('tPlus').disabled = S.tol >= 50;
    $('lVal').textContent = String(S.level).replace('-', '−'); $('lRange').value = S.level;
    $('thr').style.left = ((S.level - MIN_DB) / -MIN_DB * 100) + '%';
    document.querySelectorAll('#nameSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === S.names));
    $('nameHint').textContent =
      S.names === 'de' ? '例：a¹（A4）、h（B3）、b（B♭3）、c¹（中央ハ）、E（E2）' :
      S.names === 'en' ? '例：A4、B3、A♯3、C4（中央ハ）、E2' : '例：ラ、シ、シ♭、ド（オクターブは周波数の横に英音名で表示）';
    const w = Math.min(50, S.tol); // メーターの判定幅の帯（−50〜+50¢）
    $('band').style.left = (50 - w) + '%';
    $('band').style.width = (2 * w) + '%';
    if (lastShown) showNote(lastShown);
    drawGraph();
    save();
  }
  const setA = v => { S.A = Math.max(430, Math.min(450, v)); applySettings(); };
  const setTol = v => { S.tol = Math.max(1, Math.min(50, v)); applySettings(); };
  $('aMinus').onclick = () => setA(S.A - 1);
  $('aPlus').onclick = () => setA(S.A + 1);
  $('aRange').oninput = e => setA(parseInt(e.target.value, 10));
  $('aReset').onclick = () => setA(442);
  $('tMinus').onclick = () => setTol(S.tol - 1);
  $('tPlus').onclick = () => setTol(S.tol + 1);
  $('tRange').oninput = e => setTol(parseInt(e.target.value, 10));
  $('tReset').onclick = () => setTol(10);
  $('lRange').oninput = e => { S.level = parseInt(e.target.value, 10); applySettings(); };
  $('lReset').onclick = () => { S.level = -50; applySettings(); };
  document.querySelectorAll('#nameSeg button').forEach(b => b.onclick = () => { S.names = b.dataset.v; applySettings(); });

  /* --- 設定パネルの開閉 --- */
  function openSheet(open) {
    $('sheet').classList.toggle('open', open);
    $('sheetBg').style.display = open ? 'block' : 'none';
    document.body.classList.toggle('noscroll', open);
  }
  $('gear').onclick = () => openSheet(true);
  $('close').onclick = () => openSheet(false);
  $('sheetBg').onclick = () => openSheet(false);

  /* --- マイク --- */
  const btn = $('btn'), statusEl = $('status'), bar = $('bar'), errEl = $('err'), infoEl = $('info');
  let ctx = null, stream = null, analyser = null, buf = null, raf = 0, running = false;
  let shownDb = MIN_DB, recent = [], lastVoiced = 0, lastMidi = null;

  function setStatus(t, bad) { statusEl.textContent = t; statusEl.className = 'status' + (bad ? ' bad' : ''); }
  function showError(m) { errEl.textContent = m; errEl.style.display = m ? 'block' : 'none'; }

  function renderInfo(extra) {
    const rows = [
      ['安全な接続（isSecureContext）', window.isSecureContext ? 'はい' : 'いいえ'],
      ['マイク機能（getUserMedia）', (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ? 'あり' : 'なし'],
      ['Web Audio', (window.AudioContext || window.webkitAudioContext) ? 'あり' : 'なし'],
      ['埋め込み表示', window.self !== window.top ? 'はい（枠の中で表示）' : 'いいえ']
    ].concat(extra || []);
    infoEl.innerHTML = rows.map(r => '<div>' + r[0] + '：<b>' + r[1] + '</b></div>').join('');
  }
  function explain(e) {
    const name = (e && e.name) || 'Error';
    let hint = '';
    if (name === 'NotAllowedError' || name === 'SecurityError')
      hint = 'マイクの使用が許可されませんでした。Safariで開いているか、設定でマイクが許可されているかを確かめてください。';
    else if (name === 'NotFoundError') hint = 'マイクが見つかりませんでした。';
    else if (name === 'NotReadableError') hint = 'マイクを他のアプリが使用中の可能性があります。';
    else if (name === 'NoMediaDevices') hint = 'このページの表示場所ではマイク機能が使えません。Safariで開いてください。';
    return hint + '\n\nエラー名：' + name + '\n内容：' + ((e && e.message) || String(e));
  }

  async function start() {
    showError('');
    setStatus('準備中…');
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw Object.assign(new Error('Web Audio API がありません'), { name: 'NoWebAudio' });
      ctx = new AC(); // ボタン操作の中で作る（iPhoneの制約）
      const resumeP = ctx.resume ? ctx.resume() : Promise.resolve();
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia))
        throw Object.assign(new Error('getUserMedia がありません'), { name: 'NoMediaDevices' });
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, video: false
      });
      await resumeP;
      const src = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0;
      src.connect(analyser);
      buf = new Float32Array(analyser.fftSize);
      const track = stream.getAudioTracks()[0];
      const s = track && track.getSettings ? track.getSettings() : {};
      const onoff = v => v === undefined ? '不明' : (v ? 'オン' : 'オフ');
      renderInfo([
        ['サンプリング周波数', ctx.sampleRate + ' Hz'],
        ['マイク名', (track && track.label) || '（不明）'],
        ['エコー除去', onoff(s.echoCancellation)],
        ['ノイズ除去', onoff(s.noiseSuppression)],
        ['自動音量調整', onoff(s.autoGainControl)]
      ]);
      running = true; shownDb = MIN_DB; recent = []; lastVoiced = 0; lastMidi = null; history = [];
      btn.textContent = 'マイク停止'; btn.classList.add('stop');
      setStatus('動作中');
      loop();
    } catch (e) {
      cleanup();
      setStatus('開始できません', true);
      showError(explain(e));
    }
  }
  function cleanup() {
    running = false;
    cancelAnimationFrame(raf);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (ctx) { try { ctx.close(); } catch (_) {} ctx = null; }
    analyser = null;
    bar.style.width = '0%';
    btn.textContent = 'マイク開始'; btn.classList.remove('stop');
    clearNote();
  }
  function stop() { cleanup(); setStatus('停止中'); }

  function loop() {
    if (!running || !analyser) return;
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    const db = rms > 0 ? 20 * Math.log10(rms) : -100;
    shownDb = db > shownDb ? db : Math.max(MIN_DB, shownDb - 0.8);
    bar.style.width = Math.max(0, (shownDb - MIN_DB) / -MIN_DB * 100).toFixed(1) + '%';
    bar.classList.toggle('quiet', db < S.level);
    setStatus(Math.round(Math.max(MIN_DB, shownDb)).toString().replace('-', '−') + ' dB');

    const now = performance.now();
    const t = ctx.currentTime;
    const p = db >= S.level ? detectPitchYIN(buf, ctx.sampleRate) : null;
    if (p) {
      // 2半音以上離れた音に移ったら中央値の履歴をリセット（前の音を引きずらない）
      const m = nearestET(p.freq, S.A).midi;
      if (lastMidi !== null && Math.abs(m - lastMidi) >= 2) recent = [];
      lastMidi = m;
      recent.push(p.freq);
      if (recent.length > 5) recent.shift();
      lastVoiced = now;
      const f = median(recent);
      showNote(f);
      history.push({ t, c: nearestET(f, S.A).cents });
    } else {
      history.push({ t, c: null });
      if (now - lastVoiced > HOLD_MS) { recent = []; lastMidi = null; clearNote(); }
    }
    while (history.length && history[0].t < t - GRAPH_SEC - 0.5) history.shift();
    drawGraph();
    raf = requestAnimationFrame(loop);
  }

  btn.onclick = () => { running ? stop() : start(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden && running) stop(); });

  /* --- 内部テスト：内部で作ったサイン波を解析（音は鳴らさない） --- */
  $('testBtn').onclick = () => {
    const sr = ctx ? ctx.sampleRate : 48000;
    const A = S.A;
    const etFreq = midi => A * Math.pow(2, (midi - 69) / 12);
    const cases = [
      { label: 'A4（' + A + 'Hz）', f: A },
      { label: 'A4より3Hz高い', f: A + 3 },
      { label: 'E2（バス低音）', f: etFreq(40) },
      { label: 'C4', f: etFreq(60) },
      { label: 'B3', f: etFreq(59) },
      { label: 'B♭3', f: etFreq(58) },
      { label: 'C6（ソプラノ高音）', f: etFreq(84) },
      { label: 'C6より+25¢', f: etFreq(84) * Math.pow(2, 25 / 1200) }
    ];
    if (A !== 442) cases.splice(2, 0, { label: '442Hz', f: 442 }, { label: '445Hz', f: 445 });
    let rows = '', allPass = true;
    for (const c of cases) {
      const b = new Float32Array(2048);
      const ph = Math.random() * 2 * Math.PI;
      for (let i = 0; i < b.length; i++) b[i] = 0.5 * Math.sin(2 * Math.PI * c.f * i / sr + ph);
      const p = detectPitchYIN(b, sr);
      const truth = nearestET(c.f, A);
      if (!p) {
        allPass = false;
        rows += '<tr><td>' + c.label + '</td><td>' + c.f.toFixed(2) + '</td><td colspan="2">検出なし</td><td class="fail">×</td></tr>';
        continue;
      }
      const r = nearestET(p.freq, A);
      const errC = 1200 * Math.log2(p.freq / c.f);
      const ok = r.midi === truth.midi && Math.abs(errC) <= 1;
      if (!ok) allPass = false;
      rows += '<tr><td>' + c.label + '</td><td>' + c.f.toFixed(2) + '</td><td>' + noteName(r.midi, S.names) +
        '</td><td>' + fmtCents(r.cents) + '</td><td class="' + (ok ? 'pass' : 'fail') + '">' +
        (ok ? '○' : '×') + ' ' + Math.abs(errC).toFixed(2) + '</td></tr>';
    }
    $('testOut').innerHTML =
      '<table style="margin-top:12px"><tr><th>テスト</th><th>入力Hz</th><th>音名</th><th>ずれ</th><th>誤差¢</th></tr>' + rows + '</table>' +
      '<div class="testnote">' + (allPass ? '<span class="pass">すべて合格</span>' : '<span class="fail">不合格あり</span>') +
      '（誤差が±1¢以内で合格。サンプリング周波数 ' + sr + 'Hz、基準音 A=' + A + 'Hz で計算）</div>';
  };

  renderInfo();
  clearNote();
  applySettings();
})();
</script>
</body>
</html>

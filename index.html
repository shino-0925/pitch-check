<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合唱パート音程チェック</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --sub: #6b6b70;
    --line: #e2e0db; --accent: #2f6fd6; --ok: #2e9e5b; --warn: #d9822b; --bad: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131315; --card: #1e1e21; --text: #f2f2f4; --sub: #a0a0a8; --line: #333338; --accent: #5b92ee; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%; }
  body { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  .wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .topbar h1 { font-size: 17px; margin: 0; }
  .topbar .summary { font-size: 14px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .label { font-size: 13px; color: var(--sub); margin-bottom: 8px; }

  /* 今の音 */
  .now { text-align: center; padding: 20px 16px; }
  .note { font-size: 84px; font-weight: 800; line-height: 1; letter-spacing: -1px; min-height: 84px; }
  .cents { font-size: 40px; font-weight: 700; margin-top: 8px; font-variant-numeric: tabular-nums; min-height: 48px; }
  .hz { font-size: 18px; color: var(--sub); margin-top: 4px; font-variant-numeric: tabular-nums; min-height: 24px; }
  .dim { opacity: .35; }

  /* 音量メーター（段階0） */
  .meter { position: relative; height: 18px; border-radius: 9px; background: var(--line); overflow: hidden; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: var(--ok); transition: width 40ms linear; }
  .bar.quiet { background: var(--sub); }
  .thr { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); opacity: .5; }
  .meterrow { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin-top: 6px; }
  .status { font-size: 15px; font-weight: 600; text-align: center; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); } .status.wait { color: var(--sub); }

  button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  .big { width: 100%; min-height: 64px; font-size: 20px; font-weight: 700; border: 0; border-radius: 16px;
    background: var(--accent); color: #fff; }
  .big.stop { background: var(--bad); }
  .big.sub { background: var(--card); color: var(--accent); border: 2px solid var(--accent); min-height: 56px; font-size: 18px; }
  .big:active, .step:active { transform: scale(.98); }

  /* 基準音 */
  .stepper { display: flex; align-items: center; gap: 10px; }
  .step { width: 64px; height: 56px; font-size: 28px; font-weight: 700; border-radius: 14px;
    border: 2px solid var(--line); background: var(--bg); color: var(--text); }
  .step:disabled { opacity: .35; }
  .aval { flex: 1; text-align: center; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .aval small { font-size: 16px; color: var(--sub); font-weight: 500; }
  input[type=range] { width: 100%; margin-top: 12px; }
  .reset { margin-top: 8px; background: none; border: 0; color: var(--accent); font-size: 14px; padding: 6px 0; }

  /* テスト結果 */
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { white-space: normal; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--sub); font-weight: 500; font-size: 12px; }
  .pass { color: var(--ok); font-weight: 700; } .fail { color: var(--bad); font-weight: 700; }
  .testnote { font-size: 13px; color: var(--sub); margin-top: 8px; line-height: 1.6; }

  .info { font-size: 13px; color: var(--sub); line-height: 1.7; word-break: break-all; }
  .info b { color: var(--text); font-weight: 600; }
  .err { font-size: 14px; line-height: 1.7; color: var(--bad); white-space: pre-wrap; display: none; }
  details summary { cursor: pointer; font-size: 14px; color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>音程チェック</h1>
    <div class="summary" id="summary">平均律・A=442Hz</div>
  </div>

  <!-- 今の音 -->
  <div class="card now">
    <div class="note dim" id="note">―</div>
    <div class="cents dim" id="cents">&nbsp;</div>
    <div class="hz dim" id="hz">&nbsp;</div>
  </div>

  <!-- 音量（段階0のメーター） -->
  <div class="card">
    <div id="status" class="status wait">停止中</div>
    <div class="meter" style="margin-top:10px"><div id="bar" class="bar"></div><div id="thr" class="thr"></div></div>
    <div class="meterrow"><span>音量</span><span id="db">― dB</span></div>
  </div>

  <button id="btn" class="big" type="button">マイク開始</button>

  <div id="err" class="card err"></div>

  <!-- 基準音 -->
  <div class="card">
    <div class="label">基準音（A4の周波数）</div>
    <div class="stepper">
      <button class="step" id="aMinus" type="button" aria-label="1Hz下げる">−</button>
      <div class="aval"><span id="aVal">442</span> <small>Hz</small></div>
      <button class="step" id="aPlus" type="button" aria-label="1Hz上げる">＋</button>
    </div>
    <input type="range" id="aRange" min="430" max="450" step="1" value="442" aria-label="基準音">
    <button class="reset" id="aReset" type="button">442Hzに戻す</button>
  </div>

  <!-- 内部テスト -->
  <div class="card">
    <div class="label">内部テスト（音は鳴りません）</div>
    <button id="testBtn" class="big sub" type="button">サイン波で解析テスト</button>
    <div id="testOut"></div>
  </div>

  <details class="card">
    <summary>動作環境の情報</summary>
    <div class="info" id="info" style="margin-top:8px"></div>
  </details>
</div>

<script>
/* ===== 音高検出（YIN法） ===== */
const PITCH_MIN_HZ = 60, PITCH_MAX_HZ = 1300;
const YIN_THRESHOLD = 0.15;   // 周期とみなす谷の深さ
const YIN_ACCEPT = 0.35;      // これより浅い谷しかなければ「音程のない音」とする

// buf: Float32Array（2048サンプル）, sr: サンプリング周波数
// 戻り値: { freq, clarity } または null
function detectPitchYIN(buf, sr) {
  const N = buf.length;
  const tauMin = Math.max(2, Math.floor(sr / PITCH_MAX_HZ));
  const tauMax = Math.min(Math.ceil(sr / (PITCH_MIN_HZ * 0.95)), N - 512); // 下限より少し余裕を持たせる
  const W = N - tauMax - 1;
  if (W < 64) return null;

  // 差分関数 d(τ)
  const d = new Float32Array(tauMax + 2);
  for (let tau = 1; tau <= tauMax + 1; tau++) {
    let s = 0;
    for (let i = 0; i < W; i++) { const x = buf[i] - buf[i + tau]; s += x * x; }
    d[tau] = s;
  }
  // 累積平均正規化差分 d'(τ)
  const cm = new Float32Array(tauMax + 2);
  cm[0] = 1;
  let run = 0;
  for (let tau = 1; tau <= tauMax + 1; tau++) {
    run += d[tau];
    cm[tau] = run > 0 ? d[tau] * tau / run : 1;
  }
  // しきい値を下回った最初の谷を探す
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++) {
    if (cm[t] < YIN_THRESHOLD) {
      while (t + 1 <= tauMax && cm[t + 1] < cm[t]) t++;
      tau = t; break;
    }
  }
  if (tau < 0) { // しきい値以下が無ければ最小の谷
    let best = Infinity;
    for (let t = tauMin; t <= tauMax; t++) if (cm[t] < best) { best = cm[t]; tau = t; }
    if (best > YIN_ACCEPT) return null;
  }
  if (tau <= tauMin || tau >= tauMax) return null;

  // 放物線補間（差分関数 d の谷で周期を細かく求める）
  const a = d[tau - 1], b = d[tau], c = d[tau + 1];
  const den = a - 2 * b + c;
  let shift = den > 0 ? 0.5 * (a - c) / den : 0;
  if (shift > 1 || shift < -1) shift = 0;
  const period = tau + shift;
  const freq = sr / period;
  if (freq < PITCH_MIN_HZ * 0.97 || freq > PITCH_MAX_HZ * 1.03) return null;
  return { freq, clarity: 1 - cm[tau] };
}

/* ===== 音名とセント（平均律） ===== */
const NAMES_EN = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];

function nearestET(freq, A) {
  const n = Math.round(69 + 12 * Math.log2(freq / A));
  const ref = A * Math.pow(2, (n - 69) / 12);
  const cents = 1200 * Math.log2(freq / ref);
  return { midi: n, ref, cents };
}
function noteNameEN(midi) {
  return NAMES_EN[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
}
function fmtCents(c) {
  const r = Math.round(c);
  if (r === 0) return '±0¢';
  return (r > 0 ? '+' : '−') + Math.abs(r) + '¢';
}
function median(arr) {
  const s = arr.slice().sort((x, y) => x - y);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/* ===== 画面 ===== */
(function () {
  if (typeof document === 'undefined') return;
  const $ = id => document.getElementById(id);
  const btn = $('btn'), statusEl = $('status'), bar = $('bar'), dbEl = $('db'), thrEl = $('thr');
  const noteEl = $('note'), centsEl = $('cents'), hzEl = $('hz'), errEl = $('err'), infoEl = $('info');

  const MIN_DB = -60;
  const LEVEL_THRESHOLD_DB = -50; // これより小さい音は表示しない（段階2以降で調整可能にする）
  const HOLD_MS = 300;            // 音が途切れてから表示を消すまでの時間

  let A = 442;
  try { const v = parseInt(localStorage.getItem('pc_A'), 10); if (v >= 430 && v <= 450) A = v; } catch (_) {}

  let ctx = null, stream = null, analyser = null, buf = null, raf = 0, running = false;
  let shownDb = MIN_DB, recent = [], lastVoiced = 0;

  thrEl.style.left = ((LEVEL_THRESHOLD_DB - MIN_DB) / -MIN_DB * 100) + '%';

  /* 基準音 */
  function setA(v) {
    A = Math.max(430, Math.min(450, v));
    $('aVal').textContent = A;
    $('aRange').value = A;
    $('aMinus').disabled = A <= 430;
    $('aPlus').disabled = A >= 450;
    $('summary').textContent = '平均律・A=' + A + 'Hz';
    try { localStorage.setItem('pc_A', String(A)); } catch (_) {}
  }
  $('aMinus').addEventListener('click', () => setA(A - 1));
  $('aPlus').addEventListener('click', () => setA(A + 1));
  $('aRange').addEventListener('input', e => setA(parseInt(e.target.value, 10)));
  $('aReset').addEventListener('click', () => setA(442));
  setA(A);

  function setStatus(t, cls) { statusEl.textContent = t; statusEl.className = 'status ' + cls; }
  function showError(m) { errEl.textContent = m; errEl.style.display = m ? 'block' : 'none'; }

  function clearNote() {
    noteEl.textContent = '―'; centsEl.innerHTML = '&nbsp;'; hzEl.innerHTML = '&nbsp;';
    [noteEl, centsEl, hzEl].forEach(e => e.classList.add('dim'));
  }
  function showNote(freq) {
    const r = nearestET(freq, A);
    noteEl.textContent = noteNameEN(r.midi);
    centsEl.textContent = fmtCents(r.cents);
    hzEl.textContent = freq.toFixed(1) + ' Hz';
    [noteEl, centsEl, hzEl].forEach(e => e.classList.remove('dim'));
  }

  function renderInfo(extra) {
    const rows = [
      ['安全な接続（isSecureContext）', window.isSecureContext ? 'はい' : 'いいえ'],
      ['マイク機能（getUserMedia）', (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ? 'あり' : 'なし'],
      ['Web Audio', (window.AudioContext || window.webkitAudioContext) ? 'あり' : 'なし'],
      ['埋め込み表示', window.self !== window.top ? 'はい（枠の中で表示）' : 'いいえ']
    ].concat(extra || []);
    infoEl.innerHTML = rows.map(r => '<div>' + r[0] + '：<b>' + r[1] + '</b></div>').join('');
  }

  function explain(e) {
    const name = (e && e.name) || 'Error';
    let hint = '';
    if (name === 'NotAllowedError' || name === 'SecurityError')
      hint = 'マイクの使用が許可されませんでした。Safariで開いているか、設定でマイクが許可されているかを確かめてください。';
    else if (name === 'NotFoundError') hint = 'マイクが見つかりませんでした。';
    else if (name === 'NotReadableError') hint = 'マイクを他のアプリが使用中の可能性があります。';
    else if (name === 'NoMediaDevices') hint = 'このページの表示場所ではマイク機能が使えません。Safariで開いてください。';
    return hint + '\n\nエラー名：' + name + '\n内容：' + ((e && e.message) || String(e));
  }

  async function start() {
    showError('');
    setStatus('マイクを準備中…', 'wait');
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw Object.assign(new Error('Web Audio API がありません'), { name: 'NoWebAudio' });
      ctx = new AC(); // ボタン操作の中で作る（iPhoneの制約）
      const resumeP = ctx.resume ? ctx.resume() : Promise.resolve();
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia))
        throw Object.assign(new Error('getUserMedia がありません'), { name: 'NoMediaDevices' });
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, video: false
      });
      await resumeP;
      const src = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0;
      src.connect(analyser);
      buf = new Float32Array(analyser.fftSize);

      const track = stream.getAudioTracks()[0];
      const s = track && track.getSettings ? track.getSettings() : {};
      const onoff = v => v === undefined ? '不明' : (v ? 'オン' : 'オフ');
      renderInfo([
        ['サンプリング周波数', ctx.sampleRate + ' Hz'],
        ['マイク名', (track && track.label) || '（不明）'],
        ['エコー除去', onoff(s.echoCancellation)],
        ['ノイズ除去', onoff(s.noiseSuppression)],
        ['自動音量調整', onoff(s.autoGainControl)]
      ]);

      running = true; shownDb = MIN_DB; recent = []; lastVoiced = 0;
      btn.textContent = 'マイク停止'; btn.classList.add('stop');
      setStatus('マイク動作中', 'ok');
      loop();
    } catch (e) {
      cleanup();
      setStatus('マイクを開始できませんでした', 'bad');
      showError(explain(e));
    }
  }

  function cleanup() {
    running = false;
    cancelAnimationFrame(raf);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (ctx) { try { ctx.close(); } catch (_) {} ctx = null; }
    analyser = null;
    bar.style.width = '0%'; dbEl.textContent = '― dB';
    btn.textContent = 'マイク開始'; btn.classList.remove('stop');
    clearNote();
  }
  function stop() { cleanup(); setStatus('停止中', 'wait'); }

  function loop() {
    if (!running || !analyser) return;
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    const db = rms > 0 ? Math.max(MIN_DB, 20 * Math.log10(rms)) : MIN_DB;
    shownDb = db > shownDb ? db : Math.max(MIN_DB, shownDb - 0.8);
    bar.style.width = ((shownDb - MIN_DB) / -MIN_DB * 100).toFixed(1) + '%';
    bar.classList.toggle('quiet', db < LEVEL_THRESHOLD_DB);
    dbEl.textContent = Math.round(shownDb).toString().replace('-', '−') + ' dB';

    const now = performance.now();
    const p = db >= LEVEL_THRESHOLD_DB ? detectPitchYIN(buf, ctx.sampleRate) : null;
    if (p) {
      recent.push(p.freq);
      if (recent.length > 5) recent.shift();
      lastVoiced = now;
      showNote(median(recent)); // 直近5回の中央値
    } else if (now - lastVoiced > HOLD_MS) {
      recent = [];
      clearNote();
    }
    raf = requestAnimationFrame(loop);
  }

  btn.addEventListener('click', () => { running ? stop() : start(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && running) stop(); });

  /* 内部テスト：内部で作ったサイン波を解析（音は鳴らさない） */
  $('testBtn').addEventListener('click', () => {
    const sr = ctx ? ctx.sampleRate : 48000;
    const etFreq = midi => A * Math.pow(2, (midi - 69) / 12);
    const cases = [
      { label: 'A4（' + A + 'Hz）', f: A },
      { label: 'A4より3Hz高い', f: A + 3 },
      { label: 'E2（バス低音）', f: etFreq(40) },
      { label: 'C4', f: etFreq(60) },
      { label: 'C6（ソプラノ高音）', f: etFreq(84) },
      { label: 'C6より+25¢', f: etFreq(84) * Math.pow(2, 25 / 1200) }
    ];
    if (A !== 442) cases.splice(2, 0, { label: '442Hz', f: 442 }, { label: '445Hz', f: 445 });
    let rows = '', allPass = true;
    for (const c of cases) {
      const b = new Float32Array(2048);
      const ph = Math.random() * 2 * Math.PI;
      for (let i = 0; i < b.length; i++) b[i] = 0.5 * Math.sin(2 * Math.PI * c.f * i / sr + ph);
      const p = detectPitchYIN(b, sr);
      const truth = nearestET(c.f, A);
      if (!p) {
        allPass = false;
        rows += '<tr><td>' + c.label + '</td><td>' + c.f.toFixed(2) + '</td><td colspan="2">検出なし</td><td class="fail">×</td></tr>';
        continue;
      }
      const r = nearestET(p.freq, A);
      const errC = 1200 * Math.log2(p.freq / c.f);
      const ok = r.midi === truth.midi && Math.abs(errC) <= 1;
      if (!ok) allPass = false;
      rows += '<tr><td>' + c.label + '</td><td>' + c.f.toFixed(2) + '</td><td>' + noteNameEN(r.midi) +
        '</td><td>' + fmtCents(r.cents) + '</td><td class="' + (ok ? 'pass' : 'fail') + '">' +
        (ok ? '○' : '×') + ' ' + Math.abs(errC).toFixed(2) + '</td></tr>';
    }
    $('testOut').innerHTML =
      '<table style="margin-top:12px"><tr><th>テスト</th><th>入力Hz</th><th>音名</th><th>ずれ</th><th>誤差¢</th></tr>' + rows + '</table>' +
      '<div class="testnote">' + (allPass ? '<span class="pass">すべて合格</span>' : '<span class="fail">不合格あり</span>') +
      '（誤差が±1¢以内で合格。サンプリング周波数 ' + sr + 'Hz、基準音 A=' + A + 'Hz で計算）</div>';
  });

  renderInfo();
})();
</script>
</body>
</html>
